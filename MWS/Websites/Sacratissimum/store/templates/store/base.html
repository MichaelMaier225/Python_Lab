{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sacratissimum — Faith, worn with intention{% endblock %}</title>
  <meta name="description" content="{% block description %}Christian apparel for everyday life. Discover Sacratissimum: a thoughtful expression of faith, shared across denominations.{% endblock %}">
  <meta name="theme-color" content="#f5f2eb">
  <link rel="icon" href="{% static 'store/images/mark.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'store/css/site.css' %}">
  <script src="{% static 'store/js/site.js' %}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include 'store/includes/header.html' %}
<main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
{% include 'store/includes/footer.html' %}
</body></html>
